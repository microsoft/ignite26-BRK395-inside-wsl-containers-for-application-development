apiVersion: v1
kind: Namespace
metadata:
  name: arena
  labels:
    app.kubernetes.io/part-of: embedding-arena
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arena-dashboard
  namespace: arena
---
# The dashboard orchestrates everything in its own namespace: the pgvector database,
# the dataset seeder Job and one benchmark Job per embedding model.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arena-orchestrator
  namespace: arena
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, services, events]
    verbs: [get, list, watch, create, delete, deletecollection]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, delete, patch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arena-orchestrator
  namespace: arena
subjects:
  - kind: ServiceAccount
    name: arena-dashboard
    namespace: arena
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arena-orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arena-dashboard
  namespace: arena
  labels:
    app: arena-dashboard
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: arena-dashboard
  template:
    metadata:
      labels:
        app: arena-dashboard
    spec:
      serviceAccountName: arena-dashboard
      containers:
        - name: dashboard
          image: docker.io/library/arena:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: NAMESPACE
              value: arena
            - name: ARENA_IMAGE
              value: docker.io/library/arena:dev
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: arena-dashboard
  namespace: arena
spec:
  type: NodePort
  selector:
    app: arena-dashboard
  ports:
    - port: 80
      targetPort: 8000
      nodePort: 30080

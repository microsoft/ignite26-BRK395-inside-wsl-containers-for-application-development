# Deploy the whole project with: kubectl apply -k .
# The app code ships as ConfigMaps and runs on the stock python:3.12-slim image, so there is no image to build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arena
resources:
  - k8s/arena.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: arena-app
    files:
      - app/catalog.py
      - app/common.py
      - app/dashboard.py
      - app/seed.py
      - app/worker.py
      - app/requirements.txt
  - name: arena-static
    files:
      - app/static/index.html
      - app/static/app.js
      - app/static/style.css
